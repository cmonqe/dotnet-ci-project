name: .NET CI # Назва workflow — відображається на вкладці Actions

on: # Коли запускати?
  push:
    branches: ['main'] # При кожному push у гілку main
  workflow_dispatch: # Або вручну через кнопку на GitHub

jobs: # Список задач (job)
  build: # Назва задачі — може бути будь-яка
    runs-on: ubuntu-latest # На якій ОС виконувати (Linux сервер GitHub)

    steps: # Кроки всередині задачі (виконуються по черзі)
      - name: Clone repo # Крок 1: Назва для відображення
        uses: actions/checkout@v3 # Завантажує код репо на сервер

      - name: Install .NET # Крок 2
        uses: actions/setup-dotnet@v3 # Встановлює .NET SDK
        with:
          dotnet-version: 7.0 # Версія .NET

      - name: Restore dependencies # Крок 3
        run: dotnet restore # Та сама команда що і локально

      - name: Build # Крок 4
        run: dotnet build --no-restore # Збирає проєкт

      - name: Run tests # Крок 5
        run: dotnet test --no-build # Запускає тести
